[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-plugin-chatbridge"
version = "0.2.0"
description = "Local MCP bridge letting ChatGPT web chat drive approved local work via Hermes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael Achugwo"}]
dependencies = [
  "mcp>=2.0,<2.3",
  "starlette>=0.37,<2",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "anyio>=4.0,<5",
  "pydantic>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes_chatbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
